[package]
name = "omegazip"
version = "0.3.0"
edition = "2021"
description = "OmegaZip: 4-stage pipeline + chunked dedup, solid, encryption, recovery, ZIP export"

[dependencies]
zstd = "0.13"
lz4_flex = "0.11"
xz2 = "0.1"
walkdir = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
rayon = "1.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zip = "0.6"
flate2 = "1"
tar = "0.4"
bzip2 = "0.4"
reed-solomon-erasure = "6.0"
crc32fast = "1.3"
zeroize = "1.7"
cab = "0.6"

[dev-dependencies]
tempfile = "3"
crc32fast = "1.3"
flate2 = "1"
tar = "0.4"
zstd = "0.13"
proptest = "1.4"

[profile.release]
lto = true
codegen-units = 1
